<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101010">
<title>YT DOWNLOAD</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101010;color:white;
  font-family:Arial,sans-serif;text-align:center;
  padding:25px 16px
}
.logo{font-size:35px;font-weight:bold;color:#ff3030;margin-top:35px}
h1{font-size:27px}
p{color:#bbb}
.card{
  max-width:450px;margin:25px auto;background:#202020;
  padding:22px;border-radius:18px
}
input{
  width:100%;padding:15px;border:1px solid #555;
  border-radius:10px;background:#111;color:white;font-size:15px
}
button{
  width:100%;padding:14px;margin-top:12px;border:0;
  border-radius:10px;background:#ff3030;color:white;
  font-size:16px;font-weight:bold
}
iframe{
  width:100%;aspect-ratio:9/16;max-height:580px;
  margin-top:20px;border:0;border-radius:12px
}
#ytplayer{aspect-ratio:16/9}
#result{display:none}
.note{font-size:13px;line-height:1.6}
</style>
</head>

<body>
<div class="logo">▶ YT</div>
<h1>YT DOWNLOAD</h1>
<p>YouTube & TikTok Video Preview</p>

<div class="card">
  <input id="url" type="url"
    placeholder="Paste YouTube or TikTok link">

  <button onclick="preview()">Preview Video</button>

  <div id="result">
    <h3 id="platform"></h3>

    <iframe id="ytplayer" style="display:none"
      allowfullscreen
      allow="accelerometer; autoplay; encrypted-media; picture-in-picture">
    </iframe>

    <iframe id="ttplayer" style="display:none"
      allowfullscreen>
    </iframe>

    <button onclick="openVideo()">Open Video</button>
    <button onclick="downloadVideo()">Download Video</button>
  </div>

  <p id="msg"></p>
</div>

<p class="note">
Preview supported links and use official download options where available.
</p>

<script>
let videoURL = "";

function preview(){
  const input = document.getElementById("url").value.trim();
  const msg = document.getElementById("msg");
  const result = document.getElementById("result");
  const yt = document.getElementById("ytplayer");
  const tt = document.getElementById("ttplayer");
  const platform = document.getElementById("platform");

  msg.textContent = "";
  result.style.display = "none";
  yt.style.display = "none";
  tt.style.display = "none";
  yt.src = "";
  tt.src = "";

  let u;
  try {
    u = new URL(input);
  } catch(e) {
    msg.textContent = "Please enter a valid video link.";
    return;
  }

  const host = u.hostname.toLowerCase();
  videoURL = input;

  const isYouTube =
    host === "youtube.com" ||
    host.endsWith(".youtube.com") ||
    host === "youtu.be";

  const isTikTok =
    host === "tiktok.com" ||
    host.endsWith(".tiktok.com") ||
    host === "vt.tiktok.com" ||
    host === "vm.tiktok.com";

  if(isYouTube){
    let id = "";

    if(host === "youtu.be"){
      id = u.pathname.split("/").filter(Boolean)[0] || "";
    } else if(u.pathname === "/watch"){
      id = u.searchParams.get("v") || "";
    } else if(/^\/(shorts|embed)\/[^/]+/.test(u.pathname)){
      id = u.pathname.split("/")[2] || "";
    }

    if(!/^[a-zA-Z0-9_-]{11}$/.test(id)){
      msg.textContent = "Please enter a valid YouTube video link.";
      return;
    }

    platform.textContent = "YouTube Preview";
    yt.src = "https://www.youtube-nocookie.com/embed/" + id;
    yt.style.display = "block";

  } else if(isTikTok){
    const match = u.pathname.match(/\/video\/(\d+)/);

    if(match){
      platform.textContent = "TikTok Preview";
      tt.src = "https://www.tiktok.com/embed/v2/" + match[1];
      tt.style.display = "block";
    } else {
      platform.textContent = "TikTok Link";
      msg.textContent =
        "This is a short TikTok link. Open TikTok to view the video.";
    }

  } else {
    msg.textContent = "This website is not supported yet.";
    return;
  }

  result.style.display = "block";
}

function openVideo(){
  if(videoURL){
    window.open(videoURL, "_blank", "noopener");
  }
}

function downloadVideo(){
  if(videoURL){
    window.open(videoURL, "_blank", "noopener");
  }
}
</script>
</body>
</html>
